[book]
title = "portcullis"
description = "An open-source MCP gateway you can put in front of untrusted tools."
authors = ["The portcullis authors"]
language = "en"
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
# The path the site is served under on GitHub Pages. For a project site this is
# "/<repo-name>/". Change "portcullis" if your repo has a different name; needed
# so the 404 page and absolute asset links resolve.
site-url = "/portcullis/"
# Powers the GitHub icon and the "edit this page" pencil in the docs header.
git-repository-url = "https://github.com/routsom/portcullis"
edit-url-template = "https://github.com/routsom/portcullis/edit/main/docs/book/{path}"
additional-css = ["theme/custom.css"]

[output.html.fold]
enable = true
level = 1
