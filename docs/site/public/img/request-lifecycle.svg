<svg width="880" height="930" viewBox="0 0 880 930" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="880" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A111E"/><stop offset="1" stop-color="#0E1930"/>
    </linearGradient>
    <filter id="l-sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="l-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#F59E0B"/>
    </marker>
    <marker id="l-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="880" height="930" rx="18" fill="url(#l-bg)"/>

  <!-- happy-path spine (behind boxes) -->
  <path d="M300 58 V842" stroke="#F59E0B" stroke-width="2.4" stroke-opacity="0.9" marker-end="url(#l-a)"/>

  <!-- endpoints -->
  <g filter="url(#l-sh)"><rect x="228" y="26" width="144" height="34" rx="17" fill="#1a2942" stroke="#F59E0B" stroke-opacity="0.5"/></g>
  <text x="300" y="48" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FCD34D">Request</text>

  <g filter="url(#l-sh)"><rect x="222" y="852" width="156" height="34" rx="17" fill="#1a2942" stroke="#F59E0B" stroke-opacity="0.5"/></g>
  <text x="300" y="874" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FCD34D">Response (relayed)</text>

  <!-- ===== stage template rendered inline ===== -->
  <!-- helper coordinates: box x=110 w=380 ; number circle cx=92 ; reject pill x=560 w=270 -->

  <!-- Stage 1 : Origin & Host -->
  <g filter="url(#l-sh)"><rect x="110" y="78" width="380" height="56" rx="13" fill="#131f33" stroke="#2a3a55"/></g>
  <circle cx="92" cy="106" r="15" fill="#20304c" stroke="#F59E0B" stroke-opacity="0.5"/><text x="92" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#FCD34D">1</text>
  <text x="128" y="103" font-size="15.5" font-weight="700" fill="#eef4fb">Origin &amp; Host check</text>
  <text x="128" y="123" font-size="12" fill="#93a4bd">DNS-rebinding defence · Sec-Fetch-Site</text>
  <path d="M490 106 H556" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#l-r)"/>
  <text x="566" y="111" font-size="13" fill="#f0a3a3">✗ 403 forbidden</text>

  <!-- Stage 2 : Authenticate -->
  <g filter="url(#l-sh)"><rect x="110" y="174" width="380" height="56" rx="13" fill="#131f33" stroke="#2a3a55"/></g>
  <circle cx="92" cy="202" r="15" fill="#20304c" stroke="#F59E0B" stroke-opacity="0.5"/><text x="92" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#FCD34D">2</text>
  <text x="128" y="199" font-size="15.5" font-weight="700" fill="#eef4fb">Authenticate</text>
  <text x="128" y="219" font-size="12" fill="#93a4bd">bearer token (PAT) · constant-time compare</text>
  <path d="M490 202 H556" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#l-r)"/>
  <text x="566" y="207" font-size="13" fill="#f0a3a3">✗ 401 unauthorized</text>

  <!-- Stage 3 : Parse & negotiate -->
  <g filter="url(#l-sh)"><rect x="110" y="270" width="380" height="56" rx="13" fill="#131f33" stroke="#2a3a55"/></g>
  <circle cx="92" cy="298" r="15" fill="#20304c" stroke="#F59E0B" stroke-opacity="0.5"/><text x="92" y="303" text-anchor="middle" font-size="14" font-weight="700" fill="#FCD34D">3</text>
  <text x="128" y="295" font-size="15.5" font-weight="700" fill="#eef4fb">Parse &amp; negotiate</text>
  <text x="128" y="315" font-size="12" fill="#93a4bd">JSON-RPC frame (raw payload) · protocol version</text>
  <path d="M490 298 H556" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#l-r)"/>
  <text x="566" y="303" font-size="13" fill="#f0a3a3">✗ 400 malformed</text>

  <!-- Stage 4 : Rate limit -->
  <g filter="url(#l-sh)"><rect x="110" y="366" width="380" height="56" rx="13" fill="#131f33" stroke="#F59E0B" stroke-opacity="0.4"/></g>
  <circle cx="92" cy="394" r="15" fill="#20304c" stroke="#F59E0B" stroke-opacity="0.5"/><text x="92" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#FCD34D">4</text>
  <text x="128" y="391" font-size="15.5" font-weight="700" fill="#eef4fb">Rate limit</text>
  <text x="128" y="411" font-size="12" fill="#93a4bd">token bucket · tenant · principal · capability</text>
  <path d="M490 394 H556" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#l-r)"/>
  <text x="566" y="399" font-size="13" fill="#f0a3a3">✗ 429 rate limited</text>

  <!-- Stage 5 : Policy -->
  <g filter="url(#l-sh)"><rect x="110" y="462" width="380" height="56" rx="13" fill="#131f33" stroke="#F59E0B" stroke-opacity="0.4"/></g>
  <circle cx="92" cy="490" r="15" fill="#20304c" stroke="#F59E0B" stroke-opacity="0.5"/><text x="92" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#FCD34D">5</text>
  <text x="128" y="487" font-size="15.5" font-weight="700" fill="#eef4fb">Policy decision</text>
  <text x="128" y="507" font-size="12" fill="#93a4bd">RBAC / ABAC · fail-closed · decision cache</text>
  <path d="M490 490 H556" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#l-r)"/>
  <text x="566" y="495" font-size="13" fill="#f0a3a3">✗ 403 denied by policy</text>

  <!-- Stage 6 : Circuit breaker -->
  <g filter="url(#l-sh)"><rect x="110" y="558" width="380" height="56" rx="13" fill="#131f33" stroke="#F59E0B" stroke-opacity="0.4"/></g>
  <circle cx="92" cy="586" r="15" fill="#20304c" stroke="#F59E0B" stroke-opacity="0.5"/><text x="92" y="591" text-anchor="middle" font-size="14" font-weight="700" fill="#FCD34D">6</text>
  <text x="128" y="583" font-size="15.5" font-weight="700" fill="#eef4fb">Circuit breaker</text>
  <text x="128" y="603" font-size="12" fill="#93a4bd">per upstream · half-open probe after cooldown</text>
  <path d="M490 586 H556" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#l-r)"/>
  <text x="566" y="591" font-size="13" fill="#f0a3a3">✗ 503 circuit open</text>

  <!-- Stage 7 : Relay -->
  <g filter="url(#l-sh)"><rect x="110" y="654" width="380" height="56" rx="13" fill="#152540" stroke="#6d8bf0" stroke-opacity="0.5"/></g>
  <circle cx="92" cy="682" r="15" fill="#20304c" stroke="#F59E0B" stroke-opacity="0.5"/><text x="92" y="687" text-anchor="middle" font-size="14" font-weight="700" fill="#FCD34D">7</text>
  <text x="128" y="679" font-size="15.5" font-weight="700" fill="#eef4fb">Relay to upstream</text>
  <text x="128" y="699" font-size="12" fill="#93a4bd">stream the response through — never buffered</text>
  <path d="M490 682 H556" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#l-r)"/>
  <text x="566" y="687" font-size="13" fill="#f0a3a3">✗ 502 upstream error</text>

  <!-- Stage 8 : Record -->
  <g filter="url(#l-sh)"><rect x="110" y="750" width="380" height="56" rx="13" fill="#132a20" stroke="#3ba776" stroke-opacity="0.5"/></g>
  <circle cx="92" cy="778" r="15" fill="#20304c" stroke="#F59E0B" stroke-opacity="0.5"/><text x="92" y="783" text-anchor="middle" font-size="14" font-weight="700" fill="#FCD34D">8</text>
  <text x="128" y="775" font-size="15.5" font-weight="700" fill="#eef4fb">Record</text>
  <text x="128" y="795" font-size="12" fill="#93a4bd">breaker outcome · per-tenant metrics · audit chain</text>
</svg>
