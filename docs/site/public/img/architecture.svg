<svg width="1120" height="720" viewBox="0 0 1120 720" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/><stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(440 250) scale(520 380)">
      <stop stop-color="#f59e0b" stop-opacity="0.10"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#16233b"/><stop offset="1" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="edgeFill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1b2a44"/><stop offset="1" stop-color="#111d33"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1c2942" fill-opacity="0.5"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="edgeShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.18"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0.5 1 L9 5 L0.5 9 Z" fill="#f59e0b"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5 1 L9 5 L0.5 9 Z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="1120" height="720" rx="20" fill="url(#bg)"/>
  <rect width="1120" height="720" rx="20" fill="url(#dots)"/>
  <rect width="1120" height="720" rx="20" fill="url(#glow)"/>

  <!-- Trust boundary around the portcullis components -->
  <rect x="112" y="176" width="760" height="452" rx="22" fill="none" stroke="#334867" stroke-opacity="0.7" stroke-width="1.4" stroke-dasharray="2 7" stroke-linecap="round"/>
  <g>
    <rect x="132" y="164" width="196" height="26" rx="13" fill="#0e1626" stroke="#334867" stroke-opacity="0.8"/>
    <circle cx="149" cy="177" r="3.2" fill="#34d399"/>
    <text x="161" y="181" font-size="12.5" font-weight="600" fill="#8aa0bd">Trust boundary · your infra</text>
  </g>

  <!-- ============ connectors (behind nodes) ============ -->
  <!-- client -> edge -->
  <path d="M440 116 V196" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#ah)"/>
  <!-- edge -> upstream -->
  <path d="M715 275 H902" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#ah)"/>
  <!-- edge -> broker -->
  <path d="M280 350 V436" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#ah)"/>
  <!-- edge -> runner -->
  <path d="M695 350 V436" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#ah)"/>
  <!-- runner -> broker : no access -->
  <path d="M528 516 H414" stroke="#f87171" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ahr)"/>

  <!-- ============ edge label chips ============ -->
  <g font-size="12.5" font-weight="500">
    <g><rect x="486" y="146" width="118" height="24" rx="12" fill="#0e1626" stroke="#24324a"/><text x="545" y="162" text-anchor="middle" fill="#a7b6cc">MCP · stdio | HTTP</text></g>
    <g><rect x="794" y="252" width="56" height="24" rx="12" fill="#0e1626" stroke="#24324a"/><text x="822" y="268" text-anchor="middle" fill="#a7b6cc">HTTP</text></g>
    <g><rect x="222" y="381" width="116" height="24" rx="12" fill="#0e1626" stroke="#24324a"/><text x="280" y="397" text-anchor="middle" fill="#a7b6cc">loopback · mTLS</text></g>
    <g><rect x="631" y="381" width="128" height="24" rx="12" fill="#0e1626" stroke="#24324a"/><text x="695" y="397" text-anchor="middle" fill="#a7b6cc">one process / call</text></g>
    <g><rect x="435" y="504" width="72" height="24" rx="12" fill="#0e1626" stroke="#7f1d1d"/><text x="471" y="520" text-anchor="middle" fill="#f4a3a3" font-weight="600">no access</text></g>
  </g>

  <!-- ============ nodes ============ -->
  <!-- Agent client -->
  <g filter="url(#shadow)"><rect x="330" y="48" width="220" height="68" rx="15" fill="url(#node)" stroke="#2c3d59" stroke-width="1.3"/></g>
  <g transform="translate(352,66)" stroke="#8aa0bd" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="20" height="15" rx="2.5"/><path d="M5 5 l3 2.5 -3 2.5"/><path d="M11 10 h4"/>
  </g>
  <text x="384" y="80" font-size="17" font-weight="700" fill="#eef4fb">Agent client</text>
  <text x="384" y="100" font-size="12.5" fill="#8296b0">agents · IDEs · other gateways</text>

  <!-- portcullis-edge (hero) -->
  <g filter="url(#edgeShadow)"><rect x="165" y="200" width="550" height="150" rx="18" fill="url(#edgeFill)" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.6"/></g>
  <rect x="165" y="200" width="550" height="3.5" rx="1.75" fill="#f59e0b" fill-opacity="0.85"/>
  <g transform="translate(189,224)" stroke="#fcd34d" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 1 L20 4.4 V10.5 C20 15.6 11 19 11 19 C11 19 2 15.6 2 10.5 V4.4 Z"/>
  </g>
  <text x="220" y="240" font-size="21" font-weight="800" fill="#ffffff">portcullis-edge</text>
  <text x="220" y="262" font-size="12.5" fill="#93a4bd">Rust · forbid(unsafe) · never executes tool logic in-process</text>
  <text x="220" y="296" font-size="14" font-weight="600" fill="#fcd34d">auth · origin checks · policy · rate limits · circuit breakers · audit · metrics</text>
  <text x="220" y="324" font-size="12.5" fill="#93a4bd">routes &amp; relays streaming responses — holds no upstream credentials</text>

  <!-- Upstream MCP (external) -->
  <g filter="url(#shadow)"><rect x="902" y="238" width="200" height="74" rx="15" fill="url(#node)" stroke="#2c3d59" stroke-width="1.3"/></g>
  <g transform="translate(924,258)" stroke="#8aa0bd" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="18" height="7" rx="2"/><rect x="0" y="10" width="18" height="7" rx="2"/><circle cx="4" cy="3.5" r="0.9" fill="#8aa0bd"/><circle cx="4" cy="13.5" r="0.9" fill="#8aa0bd"/>
  </g>
  <text x="956" y="270" font-size="16" font-weight="700" fill="#eef4fb">Upstream MCP</text>
  <text x="956" y="290" font-size="12" fill="#8296b0">tool server · REST · gRPC</text>

  <!-- portcullis-broker -->
  <g filter="url(#shadow)"><rect x="150" y="440" width="260" height="152" rx="16" fill="url(#node)" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="1.4"/></g>
  <rect x="150" y="440" width="260" height="3.5" rx="1.75" fill="#2dd4bf" fill-opacity="0.75"/>
  <g transform="translate(172,462)" stroke="#5eead4" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="3.4"/><path d="M8.6 8.6 L16 16"/><path d="M13.4 13.4 l2 2"/><path d="M11 11 l2 2"/>
  </g>
  <text x="202" y="478" font-size="17" font-weight="700" fill="#eef4fb">portcullis-broker</text>
  <text x="172" y="508" font-size="12.5" fill="#9fb1c8">secrets, encrypted at rest</text>
  <text x="172" y="530" font-size="12.5" fill="#9fb1c8">short-lived credential tokens</text>
  <text x="172" y="552" font-size="12.5" fill="#9fb1c8">egress allowlist · IMDS blackhole</text>

  <!-- portcullis-runner -->
  <g filter="url(#shadow)"><rect x="530" y="440" width="332" height="152" rx="16" fill="url(#node)" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1.4"/></g>
  <rect x="530" y="440" width="332" height="3.5" rx="1.75" fill="#60a5fa" fill-opacity="0.75"/>
  <g transform="translate(552,462)" stroke="#93c5fd" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="1" width="16" height="16" rx="3"/><rect x="5" y="5" width="8" height="8" rx="1.5"/>
  </g>
  <text x="582" y="478" font-size="17" font-weight="700" fill="#eef4fb">portcullis-runner <tspan fill="#8296b0" font-size="12.5" font-weight="500">· Linux</tspan></text>
  <text x="552" y="508" font-size="12.5" fill="#9fb1c8">one sandboxed process per invocation</text>
  <text x="552" y="530" font-size="12.5" fill="#9fb1c8">user / mount / net namespaces · seccomp · landlock</text>
  <text x="552" y="552" font-size="12.5" fill="#9fb1c8">no network · no ambient host credentials</text>

  <!-- caption -->
  <text x="520" y="664" text-anchor="middle" font-size="13" fill="#7f92ab">
    Compromise of the edge <tspan fill="#cdd8e6">or</tspan> the runner alone is contained — the edge holds no secrets, the runner cannot reach the broker.
  </text>
</svg>
