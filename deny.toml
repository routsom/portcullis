# cargo-deny configuration. Run via `just deny` / `just audit`.
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
# Fail on known vulnerabilities. `yanked` warns so a transient yank does not
# break the build, but is surfaced.
version = 2
yanked = "warn"
ignore = []

[licenses]
# Everything portcullis ships is Apache-2.0 (Directive #3 / §5 row #16). We only
# accept permissive, Apache-compatible licenses in the dependency tree.
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MITNFA",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

# `ring` uses a bespoke license expression; accept its specific files.
[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
# Warn on duplicate versions; in an early tree some duplication is unavoidable,
# but we want it visible.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io by default. Adding another registry or a git source is a
# deliberate decision.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
